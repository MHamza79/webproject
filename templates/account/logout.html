{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out - DiamondTalent</title>
    <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">
    <style>
        body {
            background: linear-gradient(135deg, #6C63FF 0%, #48C6EF 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .logout-message {
            background: #fff;
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(76, 68, 182, 0.15);
            padding: 2.5rem 2rem;
            text-align: center;
            animation: fadeIn 0.8s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logout-logo {
            width: 60px;
            height: 60px;
            margin-bottom: 1rem;
            border-radius: 50%;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(76, 68, 182, 0.12);
        }
        .logo-container {
            margin: 0 auto 1rem auto;
            width: 60px;
            height: 60px;
        }
        .logout-title {
            font-weight: 700;
            color: #6C63FF;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .logout-text {
            color: #888;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }
        .logout-link a {
            color: #6C63FF;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s;
        }
        .logout-link a:hover {
            color: #48C6EF;
        }
    </style>
</head>
<body>
    <div class="logout-message">
        <div class="logout-logo logo-container">
            <img src="{% static 'img/logo1.png' %}" alt="DiamondTalent Logo" style="width: 38px; height: 38px;">
        </div>
        <div class="logout-title" aria-label="Logout confirmation">You have been logged out</div>
        <div class="logout-text">Thank you for using DiamondTalent.<br>You will be redirected to the login page shortly.</div>
        <div class="logout-link">
            <a href="{% url 'account_login' %}">Click here to login again</a>
        </div>
    </div>
</body>
</html>
