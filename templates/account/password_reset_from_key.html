{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set New Password - DiamondTalent</title>
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
<main>
    <div class="container">
        <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-4 col-md-6 d-flex flex-column align-items-center justify-content-center">
                        <div class="d-flex justify-content-center py-4">
                            <a href="/" class="logo d-flex align-items-center w-auto">
                                <img src="{% static 'img/logo1.png' %}" alt="">
                                <span class="d-none d-lg-block">DiamondTalent</span>
                            </a>
                        </div>
                        <div class="card mb-3">
                            <div class="card-body">
                                <div class="pt-4 pb-2">
                                    <h5 class="card-title text-center pb-0 fs-4">Set New Password</h5>
                                    <p class="text-center small">Enter your new password below</p>
                                </div>
                                {% if form.errors %}
                                <div class="alert alert-danger">
                                    Please correct the error{% if form.errors|length > 1 %}s{% endif %} below.
                                </div>
                                {% endif %}
                                <form method="post" action="" class="row g-3 needs-validation" novalidate>
                                    {% csrf_token %}
                                    {{ form.as_p }}
                                    <div class="col-12">
                                        <button class="btn btn-primary w-100" type="submit">Set Password</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                        <div class="credits">
                            Designed by <a href="https://bootstrapmade.com/">BootstrapMade</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>
<script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
