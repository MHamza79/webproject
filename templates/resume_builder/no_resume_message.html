{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="card">
                <div class="card-body text-center">
                    <i class="bi bi-file-earmark-text display-1 text-muted mb-3"></i>
                    <h4 class="card-title">No Resumes Available</h4>
                    <p class="card-text text-muted">
                        You need to create a resume first before you can add content to it.
                    </p>
                    <div class="mt-4">
                        <a href="{% url 'resume_create' %}" class="btn btn-primary">
                            <i class="bi bi-plus-circle me-2"></i>Create Your First Resume
                        </a>
                        <a href="{% url 'resume_list' %}" class="btn btn-secondary ms-2">
                            <i class="bi bi-arrow-left me-2"></i>Back to Resumes
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
